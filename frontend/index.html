<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml" title="Hard Quiz Feed" href="/feed.xml" />

    <!-- Perf: заранее коннектимся к Supabase CDN (изображения в блоге) -->
    <link rel="preconnect" href="https://vgjfbcihppxbtrjcxoci.supabase.co" crossorigin />

    <!-- Base SEO -->
    <title data-rh="true">Hard Quiz — Guess Movies from Stills & Faces</title>
    <meta
      data-rh="true"
      name="description"
      content="Play fast movie quizzes using still frames and faces. Explore monthly new releases and bite-size explainers."
    />
    <meta data-rh="true" name="robots" content="index, follow" />
    <meta name="theme-color" content="#101116" />
    <!-- Restore the preference before styles, prerendered content and React paint. -->
    <script>
      (() => {
        let theme = "dark";
        try { const saved = localStorage.getItem("hard-quiz-theme"); if (saved === "light" || saved === "halloween") theme = saved; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f6f7fb" : theme === "halloween" ? "#140f1b" : "#101116");
      })();
    </script>
    <style>html{background:#101116;color-scheme:dark}html[data-theme="light"]{background:#f6f7fb;color-scheme:light}html[data-theme="halloween"]{background:#140f1b;color-scheme:dark}</style>

    <!-- Open Graph -->
    <meta data-rh="true" property="og:site_name" content="Hard Quiz" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="Hard Quiz — Guess Movies from Stills & Faces" />
    <meta data-rh="true" property="og:description" content="Play fast movie quizzes using still frames and faces. Explore monthly new releases and bite-size explainers." />
    <!-- ✅ ВКЛЮЧЕНО: абсолютная ссылка на статичную картинку -->
    <meta data-rh="true" property="og:image" content="https://hard-quiz.com/og/logo.webp?v=og2" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Hard Quiz — Guess Movies from Stills & Faces" />
    <meta data-rh="true" name="twitter:description" content="Play fast movie quizzes using still frames and faces. Explore monthly new releases and bite-size explainers." />
    <meta data-rh="true" name="twitter:image" content="https://hard-quiz.com/og/logo.webp?v=og2" />
    <!-- JSON-LD Organization -->
    <script data-rh="true" type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Hard Quiz","url":"https://hard-quiz.com","logo":"https://hard-quiz.com/favicon.svg"}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
