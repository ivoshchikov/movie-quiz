name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build frontend and SEO files
        env:
          VITE_SUPABASE_URL: https://quiz-fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: local-test-placeholder
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Важно: dev-серверу нужны переменные окружения.
      # Добавь их в GitHub → Settings → Secrets and variables → Actions → New repository secret:
      #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      - name: Run tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run test:e2e

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
