name: Question bank server contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  question-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ui13-test-only
          POSTGRES_DB: hardquiz_ui13_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated SQL client and pinned Edge SDK
        run: npm install --prefix "$RUNNER_TEMP/hq-sql-test" --no-package-lock --no-save pg@8.13.3 @supabase/supabase-js@2.52.0
      - name: Verify privacy, imports and concurrent reservations
        env:
          HQ_SQL_TEST_URL: postgresql://postgres:ui13-test-only@localhost:5432/hardquiz_ui13_test
        run: HQ_NODE_PG_MODULE="$RUNNER_TEMP/hq-sql-test/node_modules/pg/lib/index.js" node --test supabase/tests/question_bank.test.mjs
      - name: Verify image decoding and upload recovery
        run: HQ_SUPABASE_SDK_MODULE="$RUNNER_TEMP/hq-sql-test/node_modules/@supabase/supabase-js/dist/main/index.js" node --test supabase/tests/question_import.test.mjs
