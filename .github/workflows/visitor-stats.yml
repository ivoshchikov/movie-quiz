name: Private visitor statistics
on:
  pull_request:
  push:
    branches: [main]
jobs:
  visitor-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: traffic-test-only
          POSTGRES_DB: hardquiz_traffic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated SQL client
        run: npm install --prefix "$RUNNER_TEMP/hq-traffic-test" --no-package-lock --no-save pg@8.13.3
      - name: Verify private statistics, owner exclusion, periods and concurrency
        env:
          HQ_TRAFFIC_TEST_URL: postgresql://postgres:traffic-test-only@localhost:5432/hardquiz_traffic_test
        run: HQ_NODE_PG_MODULE="$RUNNER_TEMP/hq-traffic-test/node_modules/pg/lib/index.js" node --test supabase/tests/visitor_stats.test.mjs
